[package]
name = "photocleaner"
version = "0.1.0"
description = "Find and delete bad photos and near-duplicate series"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
walkdir = "2"
rayon = "1"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Image decoding is the hot path; keep it fast even in `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
